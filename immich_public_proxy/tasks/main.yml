---

- name: Ensure install directory exists
  ansible.builtin.file:
    name: "{{ immich_public_proxy__install_path }}"
    state: directory
    owner: "{{ immich_public_proxy__install_owner }}"
    group: "{{ immich_public_proxy__install_owner }}"
    mode: "755"

- name: Deploy docker-compose.yml
  ansible.builtin.copy:
    src: files/docker-compose.yml
    dest: "{{ immich_public_proxy__install_path }}/docker-compose.yml"
    owner: "{{ immich_public_proxy__install_owner }}"
    group: "{{ immich_public_proxy__install_owner }}"
    mode: "644"
  notify: Pull and recreate immich-public-proxy

- name: Deploy docker-compose.override.yml from template
  ansible.builtin.template:
    src: templates/docker-compose.override.yml.j2
    dest: "{{ immich_public_proxy__install_path }}/docker-compose.override.yml"
    owner: "{{ immich_public_proxy__install_owner }}"
    group: "{{ immich_public_proxy__install_owner }}"
    mode: "644"
  notify: Pull and recreate immich-public-proxy

- name: Ensure immich-public-proxy is running
  community.docker.docker_compose_v2: # TODO: handle onscreen prompts?
    project_src: "{{ immich_public_proxy__install_path }}"
    state: present
